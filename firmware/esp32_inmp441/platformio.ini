[env:esp32dev]
platform = espressif32@6.6.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=0

[env:esp32-s3-devkitc-1]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  bblanchon/ArduinoJson@^6.21.5
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DSOUNDDETECT_I2S_BCLK_PIN=4
  -DSOUNDDETECT_I2S_WS_PIN=5
  -DSOUNDDETECT_I2S_DATA_PIN=6
